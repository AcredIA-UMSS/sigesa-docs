services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sigesa
      POSTGRES_PASSWORD: sigesa_dev
      POSTGRES_DB: sigesa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigesa -d sigesa"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/sigesa-evidence || true;
      exit 0;
      "

  evidence-service:
    build:
      context: .
      dockerfile: services/evidence-service/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://sigesa:sigesa_dev@postgres:5432/sigesa
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: sigesa-evidence
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: dev-sigesa-jwt-change-in-production
      AUDIT_INTERNAL_EVENTS_URL: http://audit-service:3002/internal/events
      INTERNAL_EVENTS_SECRET: dev-internal-secret
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://sigesa:sigesa_dev@postgres:5432/sigesa
      JWT_SECRET: dev-sigesa-jwt-change-in-production
      JWT_EXPIRES_IN: 8h
      INTERNAL_EVENTS_SECRET: dev-internal-secret
      ORCHESTRATION_INTERNAL_EVENTS_URL: http://orchestration-service:3003/internal/events
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  orchestration-service:
    build:
      context: .
      dockerfile: services/orchestration-service/Dockerfile
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://sigesa:sigesa_dev@postgres:5432/sigesa
      INTERNAL_EVENTS_SECRET: dev-internal-secret
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      PORT: 8080
      EVIDENCE_SERVICE_URL: http://evidence-service:3001
      AUDIT_SERVICE_URL: http://audit-service:3002
    ports:
      - "8080:8080"
    depends_on:
      - evidence-service
      - audit-service

volumes:
  pgdata:
  miniodata:
