# Infraestructura compartida POC-01 y POC-02 — solo desarrollo local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sigesa_poc
      POSTGRES_PASSWORD: sigesa_poc_dev
      POSTGRES_DB: sigesa_poc
    ports:
      - "5433:5432"
    volumes:
      - poc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigesa_poc -d sigesa_poc"]
      interval: 3s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - poc_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/test-sigesa-evidencias || true;
      exit 0;
      "

volumes:
  poc_pg_data:
  poc_minio_data:
